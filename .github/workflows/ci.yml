name: CI
on:
  push:
    branches: [main]
  pull_request:

# 注：仓库不提交 package-lock.json（避免 macOS 生成的 lockfile 在 Linux CI / 服务器上
# 触发 npm 跨平台 optional 依赖 bug —— rollup 的 linux 原生二进制装不上导致 vite build 失败）。
# 因此用 `npm install`（按当前平台解析），不用 `npm ci`。
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (fresh, platform-resolved)
        run: npm install
      - name: Backend tests
        run: npm test --prefix backend
      - name: Frontend build
        run: npm run build --prefix frontend
      - name: Frontend unit tests (vitest)
        run: npm run test --prefix frontend

  # 后端 API 冒烟：随 CI 起独立后端实例（PORT=3002），跑 tests/api-smoke.mjs。
  # 不设置 API_TOKEN（开放模式），与现有冒烟脚本默认行为一致。
  api-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Start backend + run API smoke
        run: |
          PORT=3002 node backend/src/index.js &
          BE=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3002/api/health >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3002 node tests/api-smoke.mjs
          kill $BE || true

  # 前端 E2E（Playwright）：构建前端 + 起后端 + 起预览(5174) + 跑 tests/e2e.mjs。
  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build --prefix frontend
      - name: Start services + run E2E
        run: |
          PORT=3002 node backend/src/index.js &
          BE=$!
          cd frontend && npx vite --config vite.preview.config.ts --port 5174 &
          FE=$!
          for i in $(seq 1 60); do curl -sf http://localhost:3002/api/health >/dev/null && curl -sf http://localhost:5174/ >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:5174 node tests/e2e.mjs
          kill $FE $BE || true
